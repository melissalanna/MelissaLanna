name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar animação SVG
        uses: Platane/snk@v3
        with:
          github_user_name: melissalanna
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=8B5CF6&color_dots=#161B22,#241B3D,#49318A,#7652D6,#00D4FF

      - name: Publicar animação na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

